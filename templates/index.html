
<!DOCTYPE html>
<html>
<head>
    <title>Student API Interface</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 700px;
            margin: 40px auto;
            padding: 20px;
        }

        button {
            padding: 8px 14px;
            margin: 5px;
            cursor: pointer;
        }

        input {
            padding: 8px;
        }

        #result,
        #greetingResult,
        #skillsResult,
        #studentList {
            margin-top: 20px;
            padding: 10px;
            border: 1px solid #cccccc;
        }

        h1 {
            text-align: center;
        }

        hr {
            margin-top: 25px;
            margin-bottom: 25px;
        }
    </style>
</head>

<body>

    <h1>Student API Interface</h1>

    <!-- Student Information API -->
    <h2>Student Information</h2>

    <button onclick="loadStudent()">
        Load Student Information
    </button>

    <div id="result"></div>

    <hr>

    <!-- Greeting API -->
    <h2>Greeting API</h2>

    <input
        type="text"
        id="greetingName"
        placeholder="Enter your name"
    >

    <button onclick="sayHello()">Say Hello</button>

    <div id="greetingResult"></div>

    <hr>

    <!-- My Skills API -->
    <div class="section">
        <h2>My Skills API</h2>

        <p>Click the button to retrieve my custom API data.</p>

        <button onclick="loadMySkills()">Load My Skills</button>

        <div id="skillsResult"></div>
    </div>

    <hr>

    <!-- Step 8: Students from Database -->
    <h2>Students from Database</h2>

    <button onclick="loadStudents()">Load Students</button>

    <div id="studentList"></div>


    <script>

        // Load Student Information
        function loadStudent() {
            fetch('/student')
                .then(response => response.json())
                .then(data => {
                    document.getElementById('result').innerHTML =
                        '<p><b>Student ID:</b> ' + data.student_id + '</p>' +
                        '<p><b>Name:</b> ' + data.name + '</p>' +
                        '<p><b>Program:</b> ' + data.program + '</p>' +
                        '<p><b>Year:</b> ' + data.year + '</p>' +
                        '<p><b>Section:</b> ' + data.section + '</p>';
                })
                .catch(error => {
                    document.getElementById('result').textContent =
                        'Unable to retrieve data.';
                });
        }


        // Greeting API
        function sayHello() {
            const name =
                document.getElementById('greetingName').value.trim();

            const result =
                document.getElementById('greetingResult');

            if (!name) {
                result.textContent = 'Please enter your name.';
                return;
            }

            fetch('/greet?name=' + encodeURIComponent(name))
                .then(response => response.json())
                .then(data => {
                    result.textContent =
                        data.message || data.greeting || JSON.stringify(data);
                })
                .catch(error => {
                    result.textContent =
                        'Unable to connect to Greeting API.';
                });
        }


        // My Skills API
        function loadMySkills() {
            const result =
                document.getElementById('skillsResult');

            fetch('/my-skills')
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Request failed');
                    }

                    return response.json();
                })
                .then(data => {
                    result.innerHTML =
                        '<p><b>Name:</b> ' + data.name + '</p>' +
                        '<p><b>Program:</b> ' + data.program + '</p>' +
                        '<p><b>Skills:</b> ' + data.skills.join(', ') + '</p>' +
                        '<p><b>Interest:</b> ' + data.interest + '</p>';
                })
                .catch(error => {
                    result.textContent =
                        'Unable to retrieve custom API data.';
                });
        }


        // Step 8: Load Students from Database
        function loadStudents() {
            const studentList =
                document.getElementById('studentList');

            fetch('/students')
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Request failed');
                    }

                    return response.json();
                })
                .then(data => {
                    let output = '';

                    data.forEach(student => {
                        output +=
                            '<p>' +
                            '<b>' + student.student_id + '</b> - ' +
                            student.name + ' | ' +
                            student.program + ' | Year ' +
                            student.year + ' | Section ' +
                            student.section +
                            '</p>';
                    });

                    studentList.innerHTML =
                        output || '<p>No student records found.</p>';
                })
                .catch(error => {
                    studentList.textContent =
                        'Unable to retrieve student records.';
                });
        }

    </script>

</body>
</html>
